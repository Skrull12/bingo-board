<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Bingo Event Boards</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --border-color: #2e3440;
            --gold-accent: #d4af37;
            --text-color: #e5e9f0;
            --completed-bg: #1e3a29;
            --completed-border: #2ecc71;
            --btn-hover: #b59226;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            color: var(--gold-accent);
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
            margin: 0;
        }

        .team-selector {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 5px;
        }

        .team-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            padding: 8px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .team-btn:hover {
            border-color: var(--gold-accent);
        }

        .team-btn.active {
            background-color: var(--gold-accent);
            color: #0f1115;
            border-color: var(--gold-accent);
        }

        .controls-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 5px;
            background-color: var(--card-bg);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .refresh-btn {
            background-color: var(--gold-accent);
            color: #0f1115;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .refresh-btn:hover {
            background-color: var(--btn-hover);
        }

        .refresh-btn:active {
            transform: scale(0.96);
        }

        .refresh-btn:disabled {
            background-color: #555;
            color: #aaa;
            cursor: not-allowed;
            transform: none;
        }

        .timer-display {
            font-size: 0.88rem;
            color: #aaa;
            font-weight: 600;
            min-width: 140px;
            text-align: left;
        }

        .progress-bar {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold-accent);
            margin-top: 5px;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 950px;
            width: 100%;
            margin-top: 15px;
        }

        .bingo-tile {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            line-height: 1.3;
            word-break: break-word;
            transition: all 0.3s ease;
        }

        .bingo-tile.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
            color: #a3e635;
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.35);
        }

        .status {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Event Bingo Standings</h1>
        <p class="subtitle" id="subtitleText">Live Board — Team A</p>

        <div class="team-selector">
            <button class="team-btn active" id="btn-Team A" onclick="selectTeam('Team A')">Team A</button>
            <button class="team-btn" id="btn-Team B" onclick="selectTeam('Team B')">Team B</button>
        </div>

        <div class="controls-bar">
            <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">
                🔄 Refresh Board
            </button>
            <span class="timer-display" id="countdownTimer">Auto-refresh: 60s</span>
        </div>

        <div class="progress-bar" id="progressCounter">Progress: -- / 25</div>
    </header>

    <div class="bingo-grid" id="bingoGrid">
        <!-- 5x5 Grid rendered dynamically -->
    </div>

    <div class="status" id="statusText">Loading board data...</div>

    <script>
        const TEAMS = {
            "Team A": {
                boardUrl: "https://docs.google.com/spreadsheets/d/1O8mewqSVtFMFYOdMLWOu7wI8DIyuAc6tlh064kD_UYc/export?format=csv&gid=924603285",
                calcUrl: "https://docs.google.com/spreadsheets/d/1O8mewqSVtFMFYOdMLWOu7wI8DIyuAc6tlh064kD_UYc/export?format=csv&gid=66597238"
            },
            "Team B": {
                boardUrl: "https://docs.google.com/spreadsheets/d/1O8mewqSVtFMFYOdMLWOu7wI8DIyuAc6tlh064kD_UYc/export?format=csv&gid=190175458",
                calcUrl: "https://docs.google.com/spreadsheets/d/1O8mewqSVtFMFYOdMLWOu7wI8DIyuAc6tlh064kD_UYc/export?format=csv&gid=989777840"
            }
        };

        let currentTeam = "Team A";
        const REFRESH_INTERVAL_SECS = 60;
        let countdownSecs = REFRESH_INTERVAL_SECS;
        let timerInterval = null;
        let isFetching = false;

        function parseCSV(text) {
            const lines = text.trim().split("\n");
            return lines.map(line => {
                const values = [];
                let insideQuotes = false;
                let currentValue = "";

                for (let char of line) {
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        values.push(currentValue.trim().replace(/^"|"$/g, ''));
                        currentValue = "";
                    } else {
                        currentValue += char;
                    }
                }
                values.push(currentValue.trim().replace(/^"|"$/g, ''));
                return values;
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            countdownSecs = REFRESH_INTERVAL_SECS;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                countdownSecs--;
                if (countdownSecs <= 0) {
                    loadBoard();
                } else {
                    updateTimerDisplay();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const timerElem = document.getElementById('countdownTimer');
            if (timerElem) {
                timerElem.innerText = `Auto-refresh: ${countdownSecs}s`;
            }
        }

        async function selectTeam(teamName) {
            if (currentTeam === teamName && !isFetching) return;
            currentTeam = teamName;

            document.querySelectorAll('.team-btn').forEach(btn => {
                btn.classList.toggle('active', btn.id === `btn-${teamName}`);
            });

            document.getElementById('subtitleText').innerText = `Live Board — ${teamName}`;
            await loadBoard();
        }

        async function manualRefresh() {
            if (isFetching) return;
            await loadBoard();
        }

        async function loadBoard() {
            if (isFetching) return;
            isFetching = true;

            const grid = document.getElementById('bingoGrid');
            const status = document.getElementById('statusText');
            const progress = document.getElementById('progressCounter');
            const btn = document.getElementById('refreshBtn');

            btn.disabled = true;
            btn.innerText = "⌛ Refreshing...";
            status.innerText = `Fetching live data for ${currentTeam}...`;

            try {
                const config = TEAMS[currentTeam];
                const cacheBuster = `&_cb=${Date.now()}`;

                const [boardRes, calcRes] = await Promise.all([
                    fetch(config.boardUrl + cacheBuster, { cache: "no-store" }),
                    fetch(config.calcUrl + cacheBuster, { cache: "no-store" })
                ]);

                if (!boardRes.ok || !calcRes.ok) {
                    throw new Error("CSV network response was not ok");
                }

                const boardText = await boardRes.text();
                const calcText = await calcRes.text();

                const boardRows = parseCSV(boardText);
                const calcRows = parseCSV(calcText);

                grid.innerHTML = "";

                const tiles = [];
                let completedCount = 0;

                boardRows.forEach((row, rIdx) => {
                    row.forEach((cell, cIdx) => {
                        const val = cell.trim();
                        if (val && !val.startsWith("Team") && val.toLowerCase() !== "false" && val.toLowerCase() !== "true") {
                            
                            let isDone = false;
                            if (calcRows[rIdx] && calcRows[rIdx][cIdx] !== undefined) {
                                const calcVal = String(calcRows[rIdx][cIdx]).trim().toUpperCase();
                                isDone = (calcVal === "TRUE" || calcVal === "1" || calcVal === "DONE");
                            }

                            if (isDone) completedCount++;
                            tiles.push({ name: val, completed: isDone });
                        }
                    });
                });

                tiles.slice(0, 25).forEach(tileObj => {
                    const tile = document.createElement('div');
                    tile.className = `bingo-tile ${tileObj.completed ? 'completed' : ''}`;
                    tile.innerText = tileObj.name;
                    grid.appendChild(tile);
                });

                progress.innerText = `Progress: ${completedCount} / ${Math.min(tiles.length, 25)} Tiles Completed`;
                status.innerText = `Live board synced (${currentTeam}). Last update: ${new Date().toLocaleTimeString()}`;

            } catch (err) {
                console.error("Board load error:", err);
                status.innerText = "Error loading board data. Check Google Sheet permissions.";
            } finally {
                isFetching = false;
                btn.disabled = false;
                btn.innerText = "🔄 Refresh Board";
                startTimer();
            }
        }

        // Initial Load
        loadBoard();
    </script>
</body>
</html>
