<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Bingo - Team A Board</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --border-color: #2e3440;
            --gold-accent: #d4af37;
            --text-color: #e5e9f0;
            --completed-bg: #1e3a29;
            --completed-border: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--gold-accent);
            margin: 0 0 8px 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
            margin: 0;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 950px;
            width: 100%;
            margin-top: 20px;
        }

        .bingo-tile {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            line-height: 1.3;
            word-break: break-word;
        }

        .bingo-tile.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
            color: #a3e635;
        }

        .status {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Event Bingo Standings</h1>
        <p class="subtitle">Live Board — Team A</p>
    </header>

    <div class="bingo-grid" id="bingoGrid">
        <!-- 5x5 Grid rendered dynamically -->
    </div>

    <div class="status" id="statusText">Loading board data...</div>

    <script>
        const TEAM_A_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoF1q_MAzJEkrLxHoiKKnlNUNrn54ULF6WXLDl1V4-RJxcTR0kO3r3d--ABZ7c-fX0ML_orATJM-Ab/pub?gid=924603285&single=true&output=csv";

        function parseCSV(text) {
            const lines = text.trim().split("\n");
            return lines.map(line => {
                const values = [];
                let insideQuotes = false;
                let currentValue = "";

                for (let char of line) {
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        values.push(currentValue.trim().replace(/^"|"$/g, ''));
                        currentValue = "";
                    } else {
                        currentValue += char;
                    }
                }
                values.push(currentValue.trim().replace(/^"|"$/g, ''));
                return values;
            });
        }

        async function loadTeamABoard() {
            const grid = document.getElementById('bingoGrid');
            const status = document.getElementById('statusText');
            grid.innerHTML = "";
            status.innerText = "Fetching live Team A data...";

            try {
                const response = await fetch(TEAM_A_CSV_URL);
                const csvData = await response.text();
                const rows = parseCSV(csvData);

                const tiles = [];
                rows.forEach(row => {
                    row.forEach(cell => {
                        const val = cell.trim();
                        // Exclude headers, blank cells, and boolean values
                        if (val && !val.startsWith("Team") && val.toLowerCase() !== "false" && val.toLowerCase() !== "true") {
                            if (!tiles.includes(val)) {
                                tiles.push(val);
                            }
                        }
                    });
                });

                // Render up to 25 tiles
                tiles.slice(0, 25).forEach(tileText => {
                    const tile = document.createElement('div');
                    tile.className = 'bingo-tile';
                    tile.innerText = tileText;
                    grid.appendChild(tile);
                });

                status.innerText = `Live board synced. Last update: ${new Date().toLocaleTimeString()}`;

            } catch (err) {
                console.error(err);
                status.innerText = "Error loading board data. Verify Google Sheets CSV publication.";
            }
        }

        // Run on page load
        loadTeamABoard();

        // Refresh every 60 seconds
        setInterval(loadTeamABoard, 60000);
    </script>
</body>
</html>
