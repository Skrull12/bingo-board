<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSRS Bingo - Team A Board</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1a1d24;
            --border-color: #2e3440;
            --gold-accent: #d4af37;
            --text-color: #e5e9f0;
            --completed-bg: #1e3a29;
            --completed-border: #2ecc71;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--gold-accent);
            margin: 0 0 8px 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
            margin: 0;
        }

        .progress-bar {
            margin-top: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold-accent);
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            max-width: 950px;
            width: 100%;
            margin-top: 20px;
        }

        .bingo-tile {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            line-height: 1.3;
            word-break: break-word;
            transition: all 0.3s ease;
        }

        .bingo-tile.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
            color: #a3e635;
            box-shadow: 0 0 12px rgba(46, 204, 113, 0.35);
        }

        .status {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Event Bingo Standings</h1>
        <p class="subtitle">Live Board — Team A</p>
        <div class="progress-bar" id="progressCounter">Progress: -- / 25</div>
    </header>

    <div class="bingo-grid" id="bingoGrid">
        <!-- 5x5 Grid rendered dynamically -->
    </div>

    <div class="status" id="statusText">Loading board data...</div>

    <script>
        // Board Tile Names CSV
        const TEAM_A_BOARD_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoF1q_MAzJEkrLxHoiKKnlNUNrn54ULF6WXLDl1V4-RJxcTR0kO3r3d--ABZ7c-fX0ML_orATJM-Ab/pub?gid=924603285&single=true&output=csv";
        
        // Paste your published Calc_Team A CSV link here:
        const TEAM_A_CALC_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQoF1q_MAzJEkrLxHoiKKnlNUNrn54ULF6WXLDl1V4-RJxcTR0kO3r3d--ABZ7c-fX0ML_orATJM-Ab/pub?gid=66597238&single=true&output=csv";

        function parseCSV(text) {
            const lines = text.trim().split("\n");
            return lines.map(line => {
                const values = [];
                let insideQuotes = false;
                let currentValue = "";

                for (let char of line) {
                    if (char === '"') {
                        insideQuotes = !insideQuotes;
                    } else if (char === ',' && !insideQuotes) {
                        values.push(currentValue.trim().replace(/^"|"$/g, ''));
                        currentValue = "";
                    } else {
                        currentValue += char;
                    }
                }
                values.push(currentValue.trim().replace(/^"|"$/g, ''));
                return values;
            });
        }

        async function loadTeamABoard() {
            const grid = document.getElementById('bingoGrid');
            const status = document.getElementById('statusText');
            const progress = document.getElementById('progressCounter');
            
            grid.innerHTML = "";
            status.innerText = "Fetching live Team A data...";

            try {
                // Fetch Board Tile Names
                const boardRes = await fetch(TEAM_A_BOARD_CSV_URL);
                const boardText = await boardRes.text();
                const boardRows = parseCSV(boardText);

                // Fetch Completion States from Calc Tab (if configured)
                let calcRows = [];
                if (TEAM_A_CALC_CSV_URL && !TEAM_A_CALC_CSV_URL.includes("YOUR_CALC")) {
                    try {
                        const calcRes = await fetch(TEAM_A_CALC_CSV_URL);
                        const calcText = await calcRes.text();
                        calcRows = parseCSV(calcText);
                    } catch (e) {
                        console.warn("Could not fetch Calc tab data:", e);
                    }
                }

                // Map grid cell by cell matching (Row x Col)
                const tiles = [];
                let completedCount = 0;

                boardRows.forEach((row, rIdx) => {
                    row.forEach((cell, cIdx) => {
                        const val = cell.trim();
                        // Ignore headers, empty cells, and naked booleans
                        if (val && !val.startsWith("Team") && val.toLowerCase() !== "false" && val.toLowerCase() !== "true") {
                            
                            // Check if corresponding cell in Calc tab is TRUE
                            let isDone = false;
                            if (calcRows[rIdx] && calcRows[rIdx][cIdx]) {
                                const calcVal = calcRows[rIdx][cIdx].trim().toUpperCase();
                                isDone = (calcVal === "TRUE" || calcVal === "1" || calcVal === "DONE");
                            }

                            if (isDone) completedCount++;
                            tiles.push({ name: val, completed: isDone });
                        }
                    });
                });

                // Render up to 25 tiles into 5x5 grid
                tiles.slice(0, 25).forEach(tileObj => {
                    const tile = document.createElement('div');
                    tile.className = `bingo-tile ${tileObj.completed ? 'completed' : ''}`;
                    tile.innerText = tileObj.name;
                    grid.appendChild(tile);
                });

                progress.innerText = `Progress: ${completedCount} / ${Math.min(tiles.length, 25)} Tiles Completed`;
                status.innerText = `Live board synced. Last update: ${new Date().toLocaleTimeString()}`;

            } catch (err) {
                console.error(err);
                status.innerText = "Error loading board data. Check CSV permissions.";
            }
        }

        loadTeamABoard();
        setInterval(loadTeamABoard, 60000);
    </script>
</body>
</html>
